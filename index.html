<title>RAG od środka</title>
<style>
/* ============================================================
   edulab - Colors & Type foundation
   Fonts (Outfit, IBM Plex Sans, Roboto Mono) load from Google Fonts
   via the <link> tags in tokens/head.html - paste that into <head>.
   No @import here: it chains requests and blocks rendering.
   ============================================================ */

:root {
  /* ---- Brand fonts ---- */
  --font-display: 'Outfit', 'IBM Plex Sans', system-ui, sans-serif;
  --font-sans:    'IBM Plex Sans', system-ui, -apple-system, sans-serif;
  --font-mono:    'Roboto Mono', ui-monospace, 'SF Mono', Menlo, monospace;

  /* ============================================================
     RAW COLOR TOKENS
     ============================================================ */

  /* Paper - page background is white; the stone steps are bands / wells.
     Warm neutral grey (no yellow cast) so yellow and the colour blocks stay the
     loudest thing on the page. Stone v2 (2026-10-10) replaced the cream sand
     (#FBF7E6 / #F5EDCB), which at 1.07:1 on white did not read as a surface. */
  --paper:    #FFFFFF;   /* page background (white)                       */
  --paper-2:  #F5F3F0;   /* stone band: alternating sections, card heads   */
  --paper-3:  #EAE6E0;   /* deepest stone: wells, table heads, bar tracks  */
  --surface:  #FFFFFF;   /* cards & sheets                                */

  /* Ink - warm near-black text & lines */
  --ink:      #1C1917;   /* primary text                                    */
  --ink-2:    #44403C;   /* secondary text, 10.3:1 on white                 */
  --ink-3:    #625B53;   /* muted / placeholder: >= 4.5:1 on every paper step */
  --line:     #E0DBD3;   /* hairline: dividers, table rows, card heads      */
  --line-2:   #C9C2B7;   /* stronger: card contours, section rules          */
  --line-strong: #857C69;/* control boundaries (inputs, ghost buttons,
                            answer options): >= 3:1 on paper steps (WCAG 1.4.11) */

  /* ---- Brand: Yellow main · Blue + Green secondary · Red danger ----
     Plain saturated colours. The base colour (--blue) is for large fills,
     illustrations and large text (>= 24px, or 19px bold). "-soft" is the
     solid fill for chips and panels that carry small text: it is the
     AA shade (= "-600"), so its "-ink" (white; dark ink on yellow) reaches
     4.5:1. A colour used AS text goes only on white and uses "-600".
     Never colour-on-colour (no green text on green).
     Gate: python3 scripts/check-contrast.py */

  /* Yellow - primary (buttons, progress, values on dark panels) */
  --yellow:      #FFD500;
  --yellow-600:  #F0C800;  /* hover / press          */
  --yellow-soft: #FFD500;  /* chip / panel fill      */
  --yellow-ink:  #1C1917;  /* text on yellow         */

  /* Blue - secondary (panels, chips, correct / selected state) */
  --blue:      #1E8FC2;
  --blue-600:  #177AA8;
  --blue-soft: #177AA8;   /* = blue-600, white text 4.8:1 */
  --blue-ink:  #FFFFFF;

  /* Green - secondary support (chips, success) */
  --green:      #00A651;
  --green-600:  #078342;  /* hover / press, AA text shade */
  --green-soft: #078342;  /* = green-600, white text 4.9:1 */
  --green-ink:  #FFFFFF;

  /* Red - danger / important / wrong (use sparingly) */
  --red:      #E5322D;
  --red-600:  #C92823;
  --red-soft: #C92823;   /* = red-600, white text 5.5:1 */
  --red-ink:  #FFFFFF;

  /* Grape - 5th category tone (colour-coded groups), from the play palette */
  --grape:      #7A5AC2;
  --grape-soft: #7A5AC2;  /* white text 5.2:1 */
  --grape-ink:  #FFFFFF;

  /* Legacy role aliases - older edulab apps use these names */
  --marigold: var(--yellow); --marigold-600: var(--yellow-600); --marigold-soft: var(--yellow-soft); --marigold-ink: var(--yellow-ink);
  --teal:     var(--blue);   --teal-600:     var(--blue-600);   --teal-soft:     var(--blue-soft);   --teal-ink:     var(--blue-ink);
  --sky:      var(--green);                                     --sky-soft:      var(--green-soft);  --sky-ink:      var(--green-ink);
  --coral:    var(--red);    --coral-600:    var(--red-600);    --coral-soft:    var(--red-soft);    --coral-ink:    var(--red-ink);

  /* Play palette - subject/category colours in the kids app */
  --play-sun:    #FFD500;
  --play-grass:  #00A651;
  --play-berry:  #C6478B;
  --play-grape:  #7A5AC2;
  --play-sky:    #1E8FC2;
  --play-coral:  #E5322D;

  /* ---- Semantic ---- */
  --success:      #00A651;  --success-soft: #078342;  --success-ink: #FFFFFF;
  --warning:      #FFD500;  --warning-soft: #FFD500;  --warning-ink: #1C1917;
  --danger:       #E5322D;  --danger-soft:  #C92823;  --danger-ink:  #FFFFFF;
  --info:         #1E8FC2;  --info-soft:    #177AA8;  --info-ink:    #FFFFFF;

  /* ---- Functional aliases ---- */
  --bg:        var(--paper);
  --fg:        var(--ink);
  --fg-muted:  var(--ink-2);
  --primary:   var(--yellow);
  --on-primary:#1C1917;      /* dark text on yellow */
  /* White gap + ink band: >= 3:1 on paper, sand, yellow and every chip fill.
     Pair with `outline: 3px solid transparent` so forced-colours mode still shows focus. */
  --focus-ring: 0 0 0 2px var(--paper), 0 0 0 5px var(--ink);
  /* Range-slider track */
  --track: color-mix(in srgb, var(--ink) 24%, transparent);

  /* ============================================================
     SPACING  (4pt base)
     ============================================================ */
  --sp-1: 4px;  --sp-2: 8px;  --sp-3: 12px; --sp-4: 16px;
  --sp-5: 20px; --sp-6: 24px; --sp-8: 32px; --sp-10: 40px;
  --sp-12: 48px; --sp-16: 64px; --sp-20: 80px; --sp-24: 96px;

  /* ---- Radii (friendly, generous) ---- */
  --r-xs: 6px; --r-sm: 10px; --r-md: 14px; --r-lg: 20px; --r-xl: 28px; --r-pill: 999px;

  /* ---- Elevation - warm, low, soft ---- */
  --shadow-sm: 0 1px 2px rgba(33,30,26,.10), 0 2px 6px rgba(33,30,26,.06);
  --shadow-md: 0 6px 18px rgba(33,30,26,.12), 0 1px 3px rgba(33,30,26,.08);
  --shadow-lg: 0 16px 40px rgba(33,30,26,.12), 0 3px 8px rgba(33,30,26,.06);
  --shadow-primary:  0 8px 22px color-mix(in srgb, var(--yellow) 30%, transparent);
  --shadow-marigold: var(--shadow-primary);   /* legacy alias */

  /* ============================================================
     TYPE SCALE (semantic sizes)
     ============================================================ */
  --display-font:  clamp(48px, 6vw, 72px);
  --h1: 44px; --h2: 33px; --h3: 25px; --h4: 19px;
  --body-lg: 18px; --body: 16px; --body-sm: 14px;
  --caption: 13px; --overline: 12px;
}

/* ============================================================
   SEMANTIC ELEMENT STYLES
   Apply via element selectors or .edu-prose wrapper.
   Element defaults are wrapped in :where(.edu) (zero specificity) so any
   single class wins: <p class="edu-overline">, <p class="edu-small">,
   <h1 class="app-title"> keep their own font/size instead of the element default.
   ============================================================ */

.edu-display, :where(.edu) h1.display {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: var(--display-font);
  line-height: 1.02;
  letter-spacing: -0.025em;
  color: var(--ink);
}
:where(.edu) h1, .edu-h1 {
  font-family: var(--font-display);
  font-weight: 700; font-size: var(--h1);
  line-height: 1.06; letter-spacing: -0.02em; color: var(--ink);
}
:where(.edu) h2, .edu-h2 {
  font-family: var(--font-display);
  font-weight: 700; font-size: var(--h2);
  line-height: 1.12; letter-spacing: -0.015em; color: var(--ink);
}
:where(.edu) h3, .edu-h3 {
  font-family: var(--font-display);
  font-weight: 700; font-size: var(--h3);
  line-height: 1.2; letter-spacing: -0.01em; color: var(--ink);
}
:where(.edu) h4, .edu-h4 {
  font-family: var(--font-sans);
  font-weight: 700; font-size: var(--h4);
  line-height: 1.3; color: var(--ink);
}
:where(.edu) p, .edu-p, .edu-body {
  font-family: var(--font-sans);
  font-weight: 400; font-size: var(--body);
  line-height: 1.6; color: var(--ink-2);
}
.edu-body-lg { font-family: var(--font-sans); font-size: var(--body-lg); line-height: 1.6; color: var(--ink-2); }
.edu-small  { font-family: var(--font-sans); font-size: var(--body-sm); line-height: 1.5; color: var(--ink-2); }
.edu-caption{ font-family: var(--font-sans); font-size: var(--caption); line-height: 1.45; color: var(--ink-3); }

/* Overline - mono, tracked; functional labels only (never above page/section titles) */
.edu-overline {
  font-family: var(--font-mono);
  font-weight: 500; font-size: var(--overline);
  letter-spacing: 0.14em; text-transform: uppercase;
  color: var(--ink);
}
:where(.edu) code, .edu-mono {
  font-family: var(--font-mono);
  font-size: 0.92em; color: var(--ink);
  background: var(--paper-3); padding: 0.12em 0.4em; border-radius: var(--r-xs);
}

/* Solid colour blocks (callouts, stat cards, chips): set background: var(--X-soft) and
   color: var(--X-ink) on the block, add .edu-block, and every heading/paragraph inside
   inherits that text colour instead of the default ink. */
.edu-block, .edu-block h1, .edu-block h2, .edu-block h3, .edu-block h4, .edu-block p,
.edu-block li, .edu-block small { color: inherit; }

body.edu { background: var(--paper); color: var(--ink); font-family: var(--font-sans); }


/* ─── App tokens ─── */
:root {
  --design-w: 1000;
  /* panel design size, mirrored in JS */
  --design-h: 660;
  --swap-ms: 850ms;
  --swap-ease: cubic-bezier(.65, 0, .35, 1);
  --view-ms: 450ms;
  --on-ink-muted: color-mix(in srgb, var(--paper) 62%, transparent);
  --on-ink-line: color-mix(in srgb, var(--paper) 16%, transparent);
}

/* ─── Base ─── */
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; }
body.edu { display: flex; flex-direction: column; min-height: 100dvh; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid transparent; outline-offset: 2px; box-shadow: var(--focus-ring); }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.ic { width: 18px; height: 18px; flex: none; }
.mono { font-family: var(--font-mono); }

/* ─── Chrome ─── */
.edu-header { position: sticky; top: 0; z-index: 50; width: 100%; background: var(--paper); border-bottom: 1px solid var(--line-2); }
.edu-header-inner { max-width: 1600px; margin: 0 auto; padding: 6px 30px; display: flex; align-items: center; gap: 12px; }
.edu-logo { width: 56px; height: 56px; display: block; margin-right: -6px; }
.edu-wordmark { font-family: var(--font-display); font-weight: 700; font-size: 22px; letter-spacing: -.02em; color: var(--ink); }
.grow { flex: 1; }
.hdr-l { font-family: var(--font-mono); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); }
.edu-seg { display: inline-flex; gap: 2px; padding: 3px; background: var(--paper-2); border-radius: var(--r-pill); flex-wrap: wrap; }
.edu-seg button { border: none; background: transparent; padding: 7px 14px; border-radius: var(--r-pill); font-family: var(--font-sans); font-weight: 600; font-size: var(--body-sm); color: var(--ink-2); cursor: pointer; transition: background-color .2s, color .2s; }
.edu-seg button:hover { background: var(--paper-3); }
.edu-seg button.active { background: var(--yellow); color: var(--yellow-ink); }

.page-head { width: 100%; max-width: 1600px; margin: 0 auto; padding: 22px 30px 20px; text-align: left; }
.app-title { font-family: var(--font-display); font-weight: 800; font-size: clamp(2.3rem, 4vw, 3.1rem); letter-spacing: -.025em; line-height: 1.05; color: var(--ink); margin: 0; }

/* ─── Stage (focus slots) ─── */
.band { flex: 1; display: flex; background: var(--paper-2); border-top: 1px solid var(--line-2); min-height: 0; }
.stage-wrap { flex: 1; display: flex; flex-direction: column; gap: 14px; width: 100%; max-width: 1600px; margin: 0 auto; padding: 18px 30px 18px; min-height: 0; }
.stage { position: relative; flex: 1; min-height: 480px; display: grid; grid-template-columns: minmax(0, 1fr) clamp(300px, 27%, 430px); gap: 22px; }
.slot-main { min-height: 0; }
.side { display: flex; flex-direction: column; gap: 14px; min-height: 0; }
.sidecard, .narr { background: var(--surface); border: 1px solid var(--line-2); border-radius: var(--r-lg); box-shadow: var(--shadow-sm); overflow: hidden; }
.sidecard { flex: none; }
.sc-head { display: flex; align-items: center; gap: 12px; padding: 9px 12px 9px 14px; background: var(--paper-2); border-bottom: 1px solid var(--line); }
.sc-head .txt { display: flex; flex-direction: column; min-width: 0; flex: 1; }
.sc-head .edu-overline { font-size: 11px; color: var(--ink-3); }
.sc-head .name { font-family: var(--font-display); font-weight: 700; font-size: 17px; color: var(--ink); }
.sc-head .ibtn { width: 36px; height: 36px; }
.sc-body { padding: 10px; }
.slot-side { width: 100%; aspect-ratio: 1000 / 660; }

/* Panel identity: user screen = black display frame, back end = green. Same tone on the frame, the
   head, the side-card badge, the narration badge and the timeline lane. */
.lane-device { --tone: var(--ink); --tone-ink: var(--yellow); }
.lane-engine { --tone: var(--green-soft); --tone-ink: var(--green-ink); }
.panel { position: absolute; left: 0; top: 0; width: 1000px; height: 660px; transform-origin: 0 0;
  background: var(--surface); border: 4px solid var(--tone); border-radius: var(--r-xl); overflow: hidden;
  box-shadow: var(--shadow-md); transition: transform var(--swap-ms) var(--swap-ease), box-shadow var(--swap-ms); z-index: 1; }
.panel.is-main { z-index: 3; box-shadow: var(--shadow-lg); }
.panel.is-side { cursor: pointer; }
#pEngine { background: var(--paper-2); }
.panel.is-side:hover { box-shadow: var(--shadow-lg); }
.stage.no-anim .panel { transition: none; }

.p-head { height: 60px; background: var(--tone); color: var(--tone-ink); display: flex; align-items: center; gap: 12px; padding: 0 18px 0 16px; }
.p-head h3 { margin: 0; font-family: var(--font-display); font-size: 23px; font-weight: 700; color: inherit; flex: 1; }
.p-head .badge.on-tone { width: 38px; height: 38px; background: var(--paper); color: var(--tone); }
.p-head .badge.on-tone .ic { width: 21px; height: 21px; }
.p-head .chip.tone-stone { background: var(--paper); color: var(--ink); }
.badge { flex: none; width: 34px; height: 34px; border-radius: var(--r-sm); display: inline-grid; place-items: center; }
.tone-ink { background: var(--ink); color: var(--yellow); }
.tone-blue { background: var(--blue-soft); color: var(--blue-ink); }
.tone-yellow { background: var(--yellow-soft); color: var(--yellow-ink); }
.tone-green { background: var(--green-soft); color: var(--green-ink); }
.tone-grape { background: var(--grape-soft); color: var(--grape-ink); }
.tone-stone { background: var(--paper-3); color: var(--ink); }
.tone-red { background: var(--red-soft); color: var(--red-ink); }
.tone-lane { background: var(--tone); color: var(--tone-ink); }
.chip { font-family: var(--font-mono); font-size: 12px; font-weight: 500; text-transform: uppercase; letter-spacing: .08em; padding: 5px 11px; border-radius: var(--r-pill); white-space: nowrap; transition: background-color .3s, color .3s; }

/* ─── Device panel ─── */
#pDevice { border: none; background: var(--ink); padding: 22px 18px 18px; }
.dev-cam { position: absolute; top: 8px; left: 50%; width: 7px; height: 7px; margin-left: -3.5px; border-radius: 50%; background: var(--ink-2); }
.app { background: var(--paper); border-radius: 12px; height: 100%; display: flex; flex-direction: column; overflow: hidden; }
.app-bar { height: 52px; flex: none; display: flex; align-items: center; gap: 12px; padding: 0 18px; border-bottom: 1px solid var(--line); }
.app-bar .badge { width: 32px; height: 32px; border-radius: 9px; }
.app-bar .badge .ic { width: 18px; height: 18px; }
.app-name { font-family: var(--font-display); font-weight: 600; font-size: 18px; color: var(--ink); flex: 1; }
.app-bar .chip { font-size: 12px; }
.app-meta { font-family: var(--font-mono); font-size: 12px; color: var(--ink-3); }
.msgs { flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end; gap: 12px; padding: 14px 18px; }
.msg { max-width: 80%; padding: 11px 16px; font-size: 18px; line-height: 1.5; border-radius: 18px; flex: none; animation: msg-in .35s ease-out; }
.msg.bot { align-self: flex-start; background: var(--paper-2); border: 1px solid var(--line); color: var(--ink); border-bottom-left-radius: 4px; }
.msg.user { align-self: flex-end; background: var(--ink); color: var(--paper); border-bottom-right-radius: 4px; }
.msg[hidden] { display: none; }
@keyframes msg-in { from { opacity: 0; transform: translateY(8px); } }
.thinking { display: flex; align-items: center; gap: 10px; color: var(--ink-2); }
.dots { display: inline-flex; gap: 4px; }
.dots i { width: 7px; height: 7px; border-radius: 50%; background: var(--ink-3); animation: dot 1.1s infinite ease-in-out; }
.dots i:nth-child(2) { animation-delay: .15s; } .dots i:nth-child(3) { animation-delay: .3s; }
@keyframes dot { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }
.cite { display: inline-grid; place-items: center; min-width: 22px; height: 21px; padding: 0 6px; margin: 0 1px; border-radius: 6px; background: var(--blue-soft); color: var(--blue-ink); font: 500 12px var(--font-mono); vertical-align: 2px; }
.srcs { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--line-2); }
.src { display: inline-flex; align-items: center; gap: 6px; font-family: var(--font-mono); font-size: 13px; color: var(--ink-2); background: var(--paper); border: 1px solid var(--line-2); border-radius: var(--r-pill); padding: 3px 9px 3px 4px; animation: msg-in .35s ease-out; }
.src.nosrc { color: var(--red-600); border-color: var(--red-600); padding-left: 7px; }
.src.nosrc .ic { width: 16px; height: 16px; }
.msg.bot.noans { border-color: var(--red-600); }
.cite.weak { background: var(--red-soft); color: var(--red-ink); }
.caret { display: inline-block; width: 2px; height: 1.1em; background: var(--ink); vertical-align: -3px; margin-left: 1px; animation: blink 1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.input-bar { height: 72px; flex: none; display: flex; align-items: center; gap: 12px; padding: 10px 16px; border-top: 1px solid var(--line); }
.field { flex: 1; height: 50px; display: flex; align-items: center; padding: 0 18px; border: 1px solid var(--line-strong); border-radius: var(--r-pill); font-size: 18px; color: var(--ink); white-space: nowrap; overflow: hidden; transition: border-color .2s, box-shadow .2s; }
.field.active { border-color: var(--ink); box-shadow: 0 0 0 3px var(--yellow); }
.field .ph { color: var(--ink-3); }
.send { width: 50px; height: 50px; border-radius: 50%; display: grid; place-items: center; background: var(--paper-3); color: var(--ink-3); flex: none; transition: background-color .2s, color .2s, transform .12s; }
.send.ready { background: var(--yellow); color: var(--yellow-ink); }
.send.press { transform: scale(.88); }


/* ─── Engine panel ─── */
.pipe { height: 108px; display: flex; align-items: flex-start; padding: 18px 26px 0; }
.node { display: flex; flex-direction: column; align-items: center; gap: 8px; width: 104px; flex: none; }
.node .badge { width: 50px; height: 50px; border-radius: var(--r-md); background: var(--paper-3); color: var(--ink-3); transition: background-color .3s, color .3s, transform .3s; }
.node .badge .ic { width: 24px; height: 24px; }
.node .lbl { font-family: var(--font-mono); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-3); text-align: center; line-height: 1.3; }
.node[data-state="done"] .badge { background: var(--ink); color: var(--yellow); }
.node[data-state="done"] .lbl { color: var(--ink-2); }
.node[data-state="active"] .badge { background: var(--yellow); color: var(--yellow-ink); transform: scale(1.1); box-shadow: 0 0 0 2px var(--paper), 0 0 0 4px var(--ink); }
.node[data-state="active"] .lbl { color: var(--ink); font-weight: 500; }
.conn { flex: 1; height: 4px; margin-top: 23px; border-radius: var(--r-pill); background: var(--line); position: relative; transition: background-color .3s; }
.conn[data-state="done"] { background: var(--ink); }
.conn[data-state="flow"] { background: var(--ink); }
.conn[data-state="flow"]::after { content: ""; position: absolute; top: -5px; left: 0; width: 14px; height: 14px; border-radius: 50%; background: var(--yellow); border: 2px solid var(--ink); animation: flow 1.2s var(--swap-ease) infinite; }

// ─── State ───
const state = {

  scenario: 0,

  stepMode: true,     // stop at the end of every step and wait for "Next step"

  speed: 0,           // index into SPEEDS
  manualFocus: null,  // overrides the step focus until the step changes
  last: 0,
  layoutKey: '',
  sc: null,           // derived scenario data (buildScenario)

};

  pipe: $('pipe'), docs: $('docs'), docsLabel: $('docsLabel'), kbBlk: $('kbBlk'), hitBlk: $('hitBlk'),

// ─── Helpers ───
const t = (key, vars) => {
  let s = (T[state.lang] && T[state.lang][key]) ?? T.pl[key] ?? key;
  if (vars) for (const k in vars) s = s.replace('{' + k + '}', vars[k]);
  return s;
};
const L = (obj) => obj[state.lang] ?? obj.pl;
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const seg = (p, a, b) => clamp((p - a) / (b - a));
const ease = (x) => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
function hash(str) { let h = 2166136261; for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
const rnd = (seed, i) => (hash(seed + ':' + i) % 10000) / 10000;
const icon = (name, cls = 'ic') => `<i data-lucide="${name}" class="${cls}"></i>`;
function setText(el, s) { if (el.textContent !== s) el.textContent = s; }
function setHTML(el, key, html) { if (state.dom[key] !== html) { state.dom[key] = html; el.innerHTML = html; } }
function setHidden(el, hidden) { if (el.hidden !== hidden) el.hidden = hidden; }
function setStyle(el, prop, val) { if (el.style[prop] !== val) el.style[prop] = val; }
function reveal(el, on) { el.classList.toggle('hide', !on); }

// Document base titles per topic slot: retrieved chunks first, then the extra ones
function kbTitles() {
  const out = {};
  TOPICS.forEach((tp) => {
    const slots = Array(DOCS_PER_TOPIC).fill(null);
    SCENARIOS.forEach((S) => S.hits.forEach((h) => { if (h.topic === tp.id) slots[h.slot] = h.src; }));
    const extra = [...DOC_EXTRA[tp.id]];
    out[tp.id] = slots.map((x) => x || extra.shift());
  });
  return out;
}
// Answer → words; "[n]" becomes a citation chip
const words = (text) => text.split(/\s+/).filter(Boolean);
function wordsHTML(ws) {
  return ws.map((w) => {
    const m = w.match(/^\[(\d)\]([.,]?)$/);
    return m ? `<span class="cite">${m[1]}</span>${m[2]}` : esc(w);
  }).join(' ');
}
function tokenize(q) {
  const out = [];
  for (const w of q.match(/[\p{L}\p{N}]+|[^\s\p{L}\p{N}]/gu) || []) {
    if (w.length > 6) { out.push({ s: w.slice(0, 4), cont: false }, { s: w.slice(4), cont: true }); }
    else out.push({ s: w, cont: false });
  }
  return out;
}
function stepDur(i = state.step) { const s = STEPS[i]; return s.dur ?? (s.id === 'type' ? state.sc.typeDur : state.sc.answerDur); }
function currentFocus() { return state.manualFocus || STEPS[state.step].focus; }
const isHeld = () => state.stepMode && state.t >= stepDur();
const isWeak = (h) => h.score < WEAK_SCORE;
// Step narration: a scenario may override the title / key idea / description of a step
function stepText(id, part) {
  const o = state.sc.S.steps && state.sc.S.steps[id] && state.sc.S.steps[id][part];
  const top = state.sc.hits[0].score.toFixed(2);
  return o ? L(o).replace('{top}', top) : t('s_' + id + '_' + part);
}

// Derived per scenario + language: everything the renderers read
function buildScenario() {
  const S = SCENARIOS[state.scenario];
  const q = L(S.q), ans = L(S.answer);
  const times = []; let acc = 250;
  for (let i = 0; i < q.length; i++) { acc += 62 + rnd(q, i) * 70 + (q[i - 1] === ' ' ? 90 : 0); times.push(acc); }
  const ansWords = words(ans);
  const hits = S.hits;
  const titles = kbTitles();
  const maxOther = Math.min(0.57, Math.min(...hits.map((h) => h.score)) - 0.06);  // non-hits stay below the weakest hit
  const docs = TOPICS.flatMap((tp) => titles[tp.id].map((title, slot) => {
    const hit = hits.findIndex((h) => h.topic === tp.id && h.slot === slot);
    return { topic: tp.id, slot, title, hit, score: hit >= 0 ? hits[hit].score : +(0.12 + rnd(q, tp.id + slot) * (maxOther - 0.12)).toFixed(2) };
  }));
  const vec = Array.from({ length: 32 }, (_, i) => +((rnd(q, 'v' + i) * 2 - 1) * (0.25 + rnd(q, 'm' + i) * 0.75)).toFixed(2));
  const ctxText = hits.map((h, i) => `[${i + 1}] ${L(h.src)}: ${L(h.text)}`).join(' ');
  const tok = { i: Math.round(t('instr').length / 4), c: Math.round(ctxText.length / 4), q: Math.round(q.length / 4) };
  const cites = new Set((ans.match(/\[\d\]/g) || [])).size;
  state.sc = { S, none: !!S.none, q, ans, times, typeDur: acc + 500, ansWords, answerDur: ansWords.length * 150 + 1600, hits, docs, vec, toks: tokenize(q), tok, cites };
  state.dom = {};
}

// ─── Render ───
function buildStatic() {

  els.pbCTxt.innerHTML = sc.hits.map((h, i) => `<div class="ln">[${i + 1}] ${esc(L(h.src))}: ${esc(L(h.text))}</div>`).join('');
  els.pbQTxt.textContent = sc.q;
  // summary
  const stats = [['tone-yellow', '3', t('stat_hits')], ['tone-blue', '≈ ' + (sc.tok.i + sc.tok.c + sc.tok.q), t('stat_tok')],
    ['tone-green', String(sc.ansWords.filter((w) => !/^\[\d\]/.test(w)).length), t('stat_words')], ['tone-ink', String(sc.cites), t('stat_cites')]];
  els.stats4.innerHTML = stats.map(([tone, n, cap]) => `<div class="statk ${tone} edu-block"><span class="num">${esc(n)}</span><span class="cap">${esc(cap)}</span></div>`).join('');
  setText(els.srcLabel, t(sc.none ? 'sourcesChecked' : 'sources'));
  const srcRows = sc.hits.map((h, i) => `<div class="trow"><span class="cite${isWeak(h) ? ' weak' : ''}">${i + 1}</span>${esc(L(h.src))}<span class="n">${h.score.toFixed(2)}</span></div>`).join('');
  els.srcList.innerHTML = srcRows;
  els.ansSrcs.innerHTML = sc.none ? `<span class="src nosrc">${icon('circle-x')}${esc(t('noSource'))}</span>`
    : sc.hits.map((h, i) => `<span class="src"><span class="cite">${i + 1}</span>${esc(L(h.src))}</span>`).join('');
  els.mAns.classList.toggle('noans', sc.none);

}

function labelCells() {

}

function applyI18n() {

  document.title = state.lang === 'pl' ? 'RAG od środka' : 'RAG inside out';

}

function layoutPanels(force) {
  const focus = currentFocus();
  const sr = stage.getBoundingClientRect(), mr = slotMain.getBoundingClientRect(), ssr = slotSide.getBoundingClientRect();
  const key = focus + '|' + [sr.width, sr.height, mr.width, mr.height, ssr.width, ssr.top - sr.top].map(Math.round).join('|');
  if (!force && key === state.layoutKey) return;
  state.layoutKey = key;
  const place = (panel, r) => {
    const s = Math.min(r.width / DESIGN_W, r.height / DESIGN_H);
    const x = r.left - sr.left + (r.width - DESIGN_W * s) / 2, y = r.top - sr.top + (r.height - DESIGN_H * s) / 2;
    panel.style.transform = `translate(${x.toFixed(1)}px, ${y.toFixed(1)}px) scale(${s.toFixed(4)})`;
  };
  const main = focus === 'device' ? pDevice : pEngine, side = main === pDevice ? pEngine : pDevice;
  place(main, mr); place(side, ssr);
  main.classList.add('is-main'); main.classList.remove('is-side'); main.dataset.role = 'main';
  side.classList.add('is-side'); side.classList.remove('is-main'); side.dataset.role = 'side';
  main.removeAttribute('tabindex'); side.setAttribute('tabindex', '0');
  side.setAttribute('aria-describedby', 'swapBtn');
  const sideId = side.dataset.panel;
  setText(els.sideName, t(sideId === 'device' ? 'deviceTitle' : 'engineTitle'));
  els.sideCard.classList.toggle('lane-device', sideId === 'device'); els.sideCard.classList.toggle('lane-engine', sideId === 'engine');
  els.sideBadge.className = 'badge nicons tone-lane';
  [...els.sideBadge.children].forEach((x) => x.classList.toggle('cur', x.dataset.for === sideId));
  stage.dataset.focus = focus;
}

function renderDevice(st, p) {
  const sc = state.sc, idx = state.step;
  const iType = STEPS.findIndex((s) => s.id === 'type'), iSend = iType + 1, iGen = STEPS.findIndex((s) => s.id === 'generate');
  // typed text: letters appear on their recorded keystroke times
  let typed = '';
  if (st.id === 'type') {
    const tm = p * stepDur();
    let n = 0; while (n < sc.times.length && sc.times[n] <= tm) n++;
    typed = sc.q.slice(0, n);
  } else if (st.id === 'send' && p < 0.3) typed = sc.q;
  const sent = idx > iSend || (idx === iSend && p >= 0.3);
  setText(els.fieldTxt, typed);
  els.field.dataset.typed = typed.length;
  setHidden(els.fieldPh, typed.length > 0);
  els.field.classList.toggle('active', st.id === 'type' || (st.id === 'send' && !sent));
  setHidden(els.caret, sent);
  els.sendBtn.classList.toggle('ready', typed.length > 0);
  els.sendBtn.classList.toggle('press', st.id === 'send' && p > 0.08 && p < 0.22);
  // messages
  setHidden(els.mUser, !sent);
  setText(els.mUser, sc.q);
  const thinking = sent && idx < iGen && !(idx === iSend && p < 0.55);
  setHidden(els.mThink, !thinking);
  if (thinking) setText(els.thinkTxt, t('think_' + (idx === iSend ? 'send' : st.id)));
  const showAns = idx >= iGen;
  setHidden(els.mAns, !showAns);
  if (showAns) {
    const n = st.id === 'generate' ? Math.floor(seg(p, 0.04, 0.94) * sc.ansWords.length) : sc.ansWords.length;
    setHTML(els.ansTxt, 'ans', wordsHTML(sc.ansWords.slice(0, n)) + (n < sc.ansWords.length ? '<span class="caret"></span>' : ''));
    els.mAns.dataset.words = n;
    setHidden(els.ansSrcs, st.id !== 'done');
  }
  // status chip
  const dKey = { idle: 'dev_idle', type: 'dev_type', send: 'dev_send', generate: 'dev_answer', done: 'dev_done' }[st.id] || 'dev_wait';
  setText(els.dStatus, t(dKey));
  els.dStatus.className = 'chip ' + ({ dev_type: 'tone-yellow', dev_send: 'tone-yellow', dev_wait: 'tone-stone', dev_answer: 'tone-green', dev_done: 'tone-green' }[dKey] || 'tone-stone');
}

function renderEngine(st, p) {
  const sc = state.sc;
  // pipeline
  const a = st.pipe;
  pipeEls.nodes.forEach((n, i) => {
    const s = a === 6 || i < a ? 'done' : i === a ? 'active' : 'pending';
    if (n.dataset.state !== s) n.dataset.state = s;
  });
  pipeEls.conns.forEach((c, i) => {
    const s = a === 6 || i + 1 < a ? 'done' : i + 1 === a ? (p < 0.35 ? 'flow' : 'done') : 'pending';
    if (c.dataset.state !== s) c.dataset.state = s;
  });
  // status
  const eKey = { idle: 'eng_idle', type: 'eng_idle', send: 'eng_send', done: 'eng_done' }[st.id] || 'eng_' + st.id;
  setText(els.eStatus, t(eKey));
  els.eStatus.className = 'chip ' + (eKey === 'eng_idle' ? 'tone-stone' : eKey === 'eng_done' ? 'tone-stone' : 'tone-yellow');
  // active view
  views.forEach((v) => v.classList.toggle('on', v.dataset.view === st.view));
  pEngine.dataset.view = st.view;

  if (st.view === 'docs') {
    const searching = st.id === 'search';
    setText(els.docsLabel, t(searching ? 'v_search' : 'v_kb'));
    els.kbBlk.classList.toggle('off', searching);
    els.hitBlk.classList.toggle('off', !searching);
    reveal(els.qChip, searching);
    // scan every chunk in turn, then pick the top 3 in rank order
    const scanK = searching ? seg(p, 0.1, 0.55) * docEls.length : -1;
    const picking = searching && p > 0.58;
    docEls.forEach((d, i) => {
      let st2 = 'idle';
      if (searching) {
        if (picking) st2 = d.hit >= 0 && p > 0.6 + d.hit * 0.1 ? 'hit' : d.hit >= 0 ? 'scored' : 'dim';
        else if (i === Math.floor(scanK)) st2 = 'scan';
        else if (i < scanK) st2 = 'scored';
      }
      if (d.el.dataset.state !== st2) d.el.dataset.state = st2;
    });
    sc.hits.forEach((h, i) => {
      const on = searching && p > 0.6 + i * 0.1;
      const row = els.hitList.children[i];
      reveal(row, on);
      setStyle(row.querySelector('.bar span'), 'width', on ? Math.round(h.score * 100) + '%' : '0%');
    });
  }
  if (st.view === 'embed') {
    const n = sc.toks.length;
    [...els.toks.children].forEach((el, i) => reveal(el, p > 0.04 + (i / n) * 0.3));
    els.embModel.classList.toggle('busy', p > 0.36 && p < 0.62);
    const bars = els.vec.children;
    for (let i = 0; i < bars.length; i++) setStyle(bars[i].firstChild, 'opacity', p > 0.55 + (i / bars.length) * 0.3 ? '1' : '0');
    reveal(els.vecNums, p > 0.86);
  }
  if (st.view === 'retrieve') {
    [...els.cards3.children].forEach((el, i) => reveal(el, p > 0.06 + i * 0.2));
    reveal(els.retrNote, p > 0.72);
  }
  if (st.view === 'augment') {
    const ks = [seg(p, 0.05, 0.2), seg(p, 0.28, 0.48), seg(p, 0.56, 0.7)];
    reveal(els.pbI, ks[0] > 0); reveal(els.pbC, ks[1] > 0); reveal(els.pbQ, ks[2] > 0);
    setText(els.tokNum, String(Math.round(sc.tok.i * ks[0] + sc.tok.c * ks[1] + sc.tok.q * ks[2])));
    reveal(els.augNote, p > 0.8);
  }
  if (st.view === 'generate') {
    const N = sc.ansWords.length, k = Math.min(N, Math.floor(seg(p, 0.05, 0.95) * N));
    setHTML(els.stream, 'stream', wordsHTML(sc.ansWords.slice(0, k)) + (k < N ? '<span class="caret"></span>' : ''));
  }
}

function renderNarration(st, p) {
  const idx = state.step;
  setText(els.nTitle, stepText(st.id, 't'));
  setText(els.nDesc, stepText(st.id, 'd'));
  setText(els.nCount, t('stepOf', { i: idx + 1, n: STEPS.length }));
  [...els.nIcons.children].forEach((s) => s.classList.toggle('cur', s.dataset.for === st.id));
  if (els.nIcons.className !== 'badge nicons tone-lane') els.nIcons.className = 'badge nicons tone-lane';
  els.narr.classList.toggle('lane-device', st.focus === 'device'); els.narr.classList.toggle('lane-engine', st.focus === 'engine');
  setText(els.nLane, t('lane_' + st.focus));
  const key = stepText(st.id, 'k');
  setText(els.nKey, key);
  setHidden(els.nKeyBox, !key);  // steps without a key idea show no callout
  els.lanes.querySelectorAll('.cell').forEach((b) => {
    const i = +b.dataset.step;
    b.classList.toggle('done', i < idx); b.classList.toggle('cur', i === idx);
    setStyle(b.firstChild, 'width', i === idx ? (p * 100).toFixed(1) + '%' : '0%');
    if (i === idx) b.setAttribute('aria-current', 'step'); else b.removeAttribute('aria-current');
  });
  els.scSeg.querySelectorAll('button').forEach((b, i) => { const on = i === state.scenario; b.classList.toggle('active', on); b.setAttribute('aria-pressed', on); });
  setText(els.speedTxt, SPEEDS[state.speed] + '×');
  const held = isHeld(), running = state.playing && !held;
  stage.dataset.playing = running; els.bPlay.dataset.playing = running;
  stage.classList.toggle('paused', !running);
  stage.dataset.mode = state.stepMode ? 'step' : 'auto'; stage.dataset.held = held;
  els.bMode.setAttribute('aria-pressed', state.stepMode);
  els.bPlay.dataset.held = held;
  const nextLabel = t(idx === STEPS.length - 1 ? 'nextScenario' : 'nextStep');
  setText(els.nextTxt, nextLabel);
  const playLabel = held ? nextLabel : t('ctrl_play');
  if (els.bPlay.getAttribute('aria-label') !== playLabel) { els.bPlay.setAttribute('aria-label', playLabel); els.bPlay.title = playLabel; }
}

function render() {
  const st = STEPS[state.step], p = clamp(state.t / stepDur());
  layoutPanels(false);
  renderDevice(st, p);
  renderEngine(st, p);
  renderNarration(st, p);
  stage.dataset.step = st.id; stage.dataset.stepIndex = state.step; stage.dataset.progress = p.toFixed(2);
  stage.dataset.scenario = state.scenario; stage.dataset.lang = state.lang;
}

// ─── Actions ───
function announce() { els.live.textContent = `${t('stepOf', { i: state.step + 1, n: STEPS.length })}: ${stepText(STEPS[state.step].id, 't')}`; }
function goStep(i) {
  const wrap = i >= STEPS.length;
  if (wrap) { setScenario((state.scenario + 1) % SCENARIOS.length, 0); return; }
  state.step = clamp(i, 0, STEPS.length - 1); state.t = 0; state.manualFocus = null; state.wasHeld = false;
  announce(); render();
}
function setScenario(i, step = 0) { state.scenario = i; buildScenario(); buildScenarioDOM(); state.step = step; state.t = 0; state.manualFocus = null; state.wasHeld = false; announce(); render(); }
function setLang(l) {
  state.lang = l; try { localStorage.setItem(LANG_KEY, l); } catch (e) { /* storage unavailable */ }
  const keepT = state.t; buildScenario(); applyI18n(); buildScenarioDOM(); state.t = Math.min(keepT, stepDur() - 1); state.layoutKey = ''; render();
}
// A held step (finished, waiting in step-by-step mode) moves on instead of toggling pause
function togglePlay() { if (isHeld()) { nextStep(); return; } state.playing = !state.playing; render(); }
function nextStep() { state.playing = true; goStep(state.step + 1); }
function toggleMode() {
  state.stepMode = !state.stepMode;
  try { localStorage.setItem(MODE_KEY, state.stepMode ? '1' : '0'); } catch (e) { /* storage unavailable */ }
  render();
}
function swapFocus() { state.manualFocus = currentFocus() === 'device' ? 'engine' : 'device'; render(); }
function prevStep() { if (state.t > 700) { state.t = 0; render(); } else goStep(state.step - 1); }

function tick(dt) {
  if (!state.playing || isHeld()) return;
  state.t += dt * SPEEDS[state.speed];
  if (state.t < stepDur()) return;
  if (!state.stepMode) { goStep(state.step + 1); return; }
  state.t = stepDur();  // hold on the last frame of the step
  if (!state.wasHeld) { state.wasHeld = true; els.live.textContent = t('heldLive'); }
}
function frame(now) {
  const dt = Math.min(64, now - (state.last || now)); state.last = now;
  tick(dt);
  render();
  requestAnimationFrame(frame);
}

// ─── Probe (DOM contract checks; run with ?probe=1 or App.probe()) ───
function probe() {
  const results = [];
  const ok = (name, cond) => results.push({ name, ok: !!cond });
  const kp = Object.keys(T.pl).sort().join(), ke = Object.keys(T.en).sort().join();
  ok('i18n key parity pl/en', kp === ke);
  const kt = kbTitles(); ok('every topic has 5 distinct chunk titles', TOPICS.every((tp) => kt[tp.id].length === DOCS_PER_TOPIC && kt[tp.id].every(Boolean) && new Set(kt[tp.id].map((x) => x.pl)).size === DOCS_PER_TOPIC));
  SCENARIOS.forEach((s, i) => {
    ok(`scenario ${i} has pl+en q/answer and 3 hits`, s.q.pl && s.q.en && s.answer.pl && s.answer.en && s.hits.length === 3 && s.hits.every((h) => h.src.en && h.text.en));
    ok(`scenario ${i}: hits sorted by score`, s.hits.every((h, j) => !j || s.hits[j - 1].score >= h.score));
    const cites = (txt) => (txt.match(/\[\d\]/g) || []).length;
    if (s.none) ok(`scenario ${i} (no answer): every hit is weak and the answer cites nothing`, s.hits.every((h) => h.score < WEAK_SCORE) && cites(s.answer.pl) === 0 && cites(s.answer.en) === 0);
    else ok(`scenario ${i}: no weak hits and the answer cites sources`, s.hits.every((h) => h.score >= WEAK_SCORE) && cites(s.answer.pl) > 0 && cites(s.answer.en) > 0);
    Object.entries(s.steps || {}).forEach(([id, o]) => ok(`scenario ${i}: step override "${id}" is a real step with pl+en`, STEPS.some((x) => x.id === id) && Object.values(o).every((v) => v.pl && v.en)));
  });
  ok('at least one scenario cannot be answered from the base', SCENARIOS.some((s) => s.none));
  const saved = { ...state, sc: null, dom: null };
  const was = state.playing, wasMode = state.stepMode; state.playing = false;
  for (const lang of ['pl', 'en']) {
    state.lang = lang;
    for (let sIdx = 0; sIdx < SCENARIOS.length; sIdx++) {
      state.scenario = sIdx; buildScenario(); buildScenarioDOM();
      const minHit = Math.min(...state.sc.hits.map((h) => h.score));
      ok(`${lang}/s${sIdx}: every non-retrieved chunk scores below the retrieved ones`, state.sc.docs.every((d) => d.hit >= 0 || d.score < minHit));
      STEPS.forEach((st, i) => {
        for (const p of [0, 0.5, 0.99]) {
          state.step = i; state.manualFocus = null; state.t = p * stepDur(); render();
          const tag = `${lang}/s${sIdx}/${st.id}@${p}`;
          const main = stage.querySelector('[data-role="main"]');
          ok(`${tag}: main panel matches step focus`, main && main.dataset.panel === st.focus && stage.dataset.focus === st.focus);
          ok(`${tag}: exactly one view on`, views.filter((v) => v.classList.contains('on')).length === 1 && pEngine.dataset.view === st.view);
          const active = pipeEls.nodes.filter((n) => n.dataset.state === 'active').length;
          ok(`${tag}: pipeline state`, st.pipe >= 0 && st.pipe < 6 ? active === 1 && pipeEls.nodes[st.pipe].dataset.state === 'active' : active === 0);
          if (st.id === 'type' && p === 0.99) ok(`${tag}: question fully typed`, els.fieldTxt.textContent === state.sc.q);
          if (st.id === 'done') ok(`${tag}: full answer + sources visible`, +els.mAns.dataset.words === state.sc.ansWords.length && !els.ansSrcs.hidden);
          if (st.id === 'done') ok(`${tag}: no-answer scenario shows "no source", others list sources`, state.sc.none
            ? els.ansSrcs.querySelectorAll('.nosrc').length === 1 && !els.ansTxt.querySelector('.cite') && els.mAns.classList.contains('noans')
            : els.ansSrcs.querySelectorAll('.src:not(.nosrc)').length === 3 && !els.mAns.classList.contains('noans'));
          if (st.id === 'search' && p === 0.99) ok(`${tag}: weak picks marked red exactly in the no-answer scenario`, docEls.filter((d) => d.el.dataset.state === 'hit' && d.el.dataset.weak === '1').length === (state.sc.none ? 3 : 0));
          ok(`${tag}: narration has a title and description`, els.nTitle.textContent.length > 0 && els.nDesc.textContent.length > 0 && !/\{top\}/.test(els.nDesc.textContent));
          if (st.id === 'idle') ok(`${tag}: no user message yet`, els.mUser.hidden && els.mAns.hidden);
          if (st.id === 'search' && p === 0.99) ok(`${tag}: exactly the 3 retrieved chunks are picked`, docEls.filter((d) => d.el.dataset.state === 'hit').map((d) => d.hit).sort().join() === '0,1,2');
          if (st.id === 'generate' && p === 0.5) ok(`${tag}: answer is mid-way on screen`, +els.mAns.dataset.words > 0 && +els.mAns.dataset.words < state.sc.ansWords.length && els.ansSrcs.hidden);
        }
      });
      state.step = STEPS.findIndex((x) => x.id === 'type'); state.t = 0.5 * stepDur(); render();
      const half = els.fieldTxt.textContent;
      ok(`${lang}/s${sIdx}: typing mid-way shows a partial prefix`, half.length > 0 && half.length < state.sc.q.length && state.sc.q.startsWith(half));
      // step-by-step mode: a finished step holds on its last frame until "Next step"
      const iEmbed = STEPS.findIndex((x) => x.id === 'embed');
      state.playing = true; state.stepMode = true; state.step = iEmbed; state.t = stepDur() - 20; state.wasHeld = false;
      tick(200); tick(200); render();
      ok(`${lang}/s${sIdx}: step mode holds at the end of a step`, state.step === iEmbed && state.t === stepDur() && stage.dataset.held === 'true' && els.bPlay.dataset.held === 'true' && stage.dataset.playing === 'false');
      nextStep();
      ok(`${lang}/s${sIdx}: "Next step" moves on and plays`, state.step === iEmbed + 1 && state.t === 0 && stage.dataset.held === 'false' && els.bPlay.dataset.held === 'false');
      state.stepMode = false; state.step = iEmbed; state.t = stepDur() - 20; tick(200);
      ok(`${lang}/s${sIdx}: auto mode runs straight into the next step`, state.step === iEmbed + 1);
      state.playing = false; state.stepMode = wasMode;
    }
  }
  // target scales (not live rects, which lag behind while the swap animates)
  const scaleOf = (el) => +(el.style.transform.match(/scale\(([\d.]+)\)/) || [0, 0])[1];
  const mainEl = stage.querySelector('[data-role="main"]'), sideEl = stage.querySelector('[data-role="side"]');
  ok('main panel larger than side panel', scaleOf(mainEl) > scaleOf(sideEl));
  Object.assign(state, { lang: saved.lang, scenario: saved.scenario, step: saved.step, t: saved.t, playing: was, stepMode: wasMode, wasHeld: saved.wasHeld, manualFocus: saved.manualFocus });
  buildScenario(); applyI18n(); buildScenarioDOM(); state.layoutKey = ''; render();
  const failed = results.filter((r) => !r.ok);
  document.documentElement.dataset.probe = failed.length ? 'fail' : 'pass';
  document.documentElement.dataset.probeCount = results.length;
  console.log(`[rag-focus probe] ${results.length - failed.length}/${results.length} passed`, failed);
  return { passed: results.length - failed.length, total: results.length, failed };
}

// ─── Listeners ───
els.langSeg.addEventListener('click', (e) => { const b = e.target.closest('button[data-lang]'); if (b && b.dataset.lang !== state.lang) setLang(b.dataset.lang); });
els.scSeg.addEventListener('click', (e) => { const b = e.target.closest('button[data-sc]'); if (b) setScenario(+b.dataset.sc); });
els.lanes.addEventListener('click', (e) => { const b = e.target.closest('button[data-step]'); if (b) goStep(+b.dataset.step); });
els.bPlay.addEventListener('click', togglePlay);
els.bPrev.addEventListener('click', prevStep);
els.bNext.addEventListener('click', nextStep);
els.bMode.addEventListener('click', toggleMode);
els.bRestart.addEventListener('click', () => goStep(0));
els.bSpeed.addEventListener('click', () => { state.speed = (state.speed + 1) % SPEEDS.length; render(); });
els.swapBtn.addEventListener('click', swapFocus);
[pDevice, pEngine].forEach((pnl) => {
  pnl.addEventListener('click', () => { if (pnl.dataset.role === 'side') swapFocus(); });
  pnl.addEventListener('keydown', (e) => { if (pnl.dataset.role === 'side' && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); e.stopPropagation(); swapFocus(); } });
});
document.addEventListener('keydown', (e) => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const k = e.key.toLowerCase();
  if (k === ' ' && !e.target.closest('button')) { e.preventDefault(); togglePlay(); }
  else if (k === 'arrowright') { e.preventDefault(); nextStep(); }
  else if (k === 'arrowleft') { e.preventDefault(); prevStep(); }
  else if (k === 'f') swapFocus();
  else if (k === 'r') goStep(0);
  else if (k === 'l') setLang(state.lang === 'pl' ? 'en' : 'pl');
  else if (k === 'a') toggleMode();
  else if (k >= '1' && k <= String(SCENARIOS.length)) setScenario(+k - 1);
});
new ResizeObserver(() => {
  stage.classList.add('no-anim'); layoutPanels(true);
  requestAnimationFrame(() => requestAnimationFrame(() => stage.classList.remove('no-anim')));
}).observe(stage);

// ─── Init ───
try { const l = localStorage.getItem(LANG_KEY); if (l === 'pl' || l === 'en') state.lang = l; } catch (e) { /* storage unavailable */ }
try { if (localStorage.getItem(MODE_KEY) === '0') state.stepMode = false; } catch (e) { /* storage unavailable */ }
const params = new URLSearchParams(location.search);
if (params.has('auto')) state.stepMode = false;
if (params.has('sc')) state.scenario = clamp(+params.get('sc') || 0, 0, SCENARIOS.length - 1);
buildStatic();
buildScenario();
applyI18n();
buildScenarioDOM();
if (params.has('step')) state.step = clamp(+params.get('step') || 0, 0, STEPS.length - 1);
if (params.has('p')) state.t = clamp(+params.get('p')) * stepDur();
if (params.has('pause')) state.playing = false;
stage.classList.add('no-anim');
render();
requestAnimationFrame(() => requestAnimationFrame(() => stage.classList.remove('no-anim')));
window.App = { state, probe, goStep, nextStep, setScenario, setLang, swapFocus, toggleMode, tick, render };
if (params.has('probe')) probe();
requestAnimationFrame(frame);

// ─── Reveal ───
const FONT_WAIT_MS = 1500;
const BRAND_FONTS = ['400 1em Outfit', '700 1em Outfit', '400 1em "IBM Plex Sans"', '600 1em "IBM Plex Sans"', '400 1em "Roboto Mono"'];
Promise.race([
  Promise.all(BRAND_FONTS.map((f) => document.fonts.load(f).catch(() => null))),
  new Promise((r) => setTimeout(r, FONT_WAIT_MS)),
]).then(() => document.documentElement.classList.add('app-ready'));
</script>
</body>
</html>
